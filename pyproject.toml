[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-team-workspace"
version = "0.1.0"
description = "File-native Team Workspace runtime kernel"
requires-python = ">=3.11"
dependencies = [
  "filelock>=3,<4",
  "jsonschema>=4,<5",
]

[project.scripts]
teamctl = "orbital_team.cli:main"
teamd = "orbital_team.teamd:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orbital_team = ["skills/*.md", "dashboard_static/*"]

[tool.setuptools.data-files]
"share/orbital-team/schemas/v1" = ["schemas/v1/orbital-team.schema.json"]
"share/orbital-team/skills/orbital-team-manager" = ["skills/orbital-team-manager/SKILL.md"]
"share/orbital-team/skills/orbital-team-member" = ["skills/orbital-team-member/SKILL.md"]
"share/orbital-team/skills/orbital-team-member/agents" = ["skills/orbital-team-member/agents/openai.yaml"]
"share/orbital-team/skills/orbital-team-member/scripts" = ["skills/orbital-team-member/scripts/install_adapter.py"]
"share/orbital-team/skills/orbital-team-member/assets/claude-code/commands" = ["skills/orbital-team-member/assets/claude-code/commands/team.md"]
"share/orbital-team/skills/orbital-team-member/assets/claude-code/hooks" = ["skills/orbital-team-member/assets/claude-code/hooks/orbital_team_session_start.py"]
